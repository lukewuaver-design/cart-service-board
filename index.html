<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>充電車維修大富翁</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: a square board game (12 perimeter tiles, logo in the middle) beside a rules panel; stacks on phones */
:root{
  --page:#e6ece7; --fg:#18241c; --muted:#56655b; --panel:#ffffff; --panel-line:#cfd9d1;
  --board:#cfe6d3; --tile:#eaf5ec; --ink:#14221a; --line:#1b2b20;
  --blue:#2f74d0; --orange:#ec8420; --green:#1d9653; --purple:#8548bd; --red:#d6362a; --gold:#f2c230;
  --display:"Bungee","Noto Sans TC",system-ui,sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#0f1612;--fg:#dde8e0;--muted:#97a89c;--panel:#18221c;--panel-line:#2c3a31;color-scheme:dark}}
:root[data-theme="dark"]{--page:#0f1612;--fg:#dde8e0;--muted:#97a89c;--panel:#18221c;--panel-line:#2c3a31;color-scheme:dark}

body{background:var(--page);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6}
.wrap{max-width:1120px;margin:0 auto;padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
@media (max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}}

/* ---------- board ---------- */
.board-shell{container-type:inline-size;width:100%;max-width:660px;justify-self:center}
.board{position:relative;aspect-ratio:1;max-width:100%;background:var(--board);border:3px solid var(--line);
  display:grid;grid-template-columns:1.35fr 1fr 1fr 1.35fr;grid-template-rows:1.35fr 1fr 1fr 1.35fr;box-shadow:0 10px 30px rgba(20,34,26,.18)}
.tile{position:relative;background:var(--tile);border:1.5px solid var(--line);color:var(--ink);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.2em;
  padding:6px 4px;font-size:clamp(10px,2.3cqi,15px);line-height:1.25;font-family:inherit;min-width:0}
.tile:hover,.tile:focus-visible{background:#fff;outline:none;z-index:2;box-shadow:inset 0 0 0 3px var(--gold)}
.tile.active{background:#fffbe6;box-shadow:inset 0 0 0 3px var(--gold)}
.band{position:absolute;background:var(--c)}
.side-b .band{left:0;right:0;top:0;height:22%}
.side-t .band{left:0;right:0;bottom:0;height:22%}
.side-l .band{top:0;bottom:0;right:0;width:20%}
.side-r .band{top:0;bottom:0;left:0;width:20%}
.side-b{padding-top:calc(22% + 6px)} .side-t{padding-bottom:calc(22% + 6px)}
.side-l{padding-right:calc(20% + 4px)} .side-r{padding-left:calc(20% + 4px)}
.t-num{font-family:var(--display);font-size:.85em;color:var(--muted);letter-spacing:.04em}
.t-name{font-weight:900;font-size:1.05em;text-wrap:balance}
.t-sys{font-size:.78em;color:#4a5a50;border-top:1px dashed #9db3a3;padding-top:.15em;margin-top:.1em}
.corner .t-name{font-size:1.2em}
.corner .t-big{font-family:var(--display);font-size:2.1em;line-height:1;color:var(--red)}
.go .t-big{font-size:2.6em}
.corner .t-sub{font-size:.75em;color:#4a5a50}
.jail{background:repeating-linear-gradient(90deg,#ffe3df 0 10px,#fff1ee 10px 20px)}
.jail .t-days{font-family:var(--display);color:var(--red);font-size:1.25em;line-height:1}
.jail .t-pct{font-size:.75em;font-weight:700;background:var(--red);color:#fff;padding:0 .4em;border-radius:3px}

.center{grid-row:2/4;grid-column:2/4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4%;padding:4%;overflow:hidden}
.logo{transform:rotate(-12deg);background:var(--red);color:#fff;border:3px solid var(--line);padding:.35em .8em;text-align:center;box-shadow:4px 4px 0 var(--line)}
.logo b{display:block;font-weight:900;font-size:clamp(14px,4.6cqi,30px);letter-spacing:.06em;line-height:1.2}
.logo span{display:block;font-family:var(--display);font-size:clamp(8px,1.9cqi,12px);letter-spacing:.12em}
.die{width:clamp(34px,9cqi,60px);aspect-ratio:1;background:#fff;border:2.5px solid var(--line);border-radius:18%;display:grid;place-items:center;
  font-family:var(--display);font-size:clamp(16px,5cqi,32px);color:var(--ink);box-shadow:3px 3px 0 var(--line)}
.die.rolling{animation:shake .5s}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-18deg)}50%{transform:rotate(14deg)}75%{transform:rotate(-8deg)}}
.chance{background:var(--orange);color:#fff;border:2px solid var(--line);font-weight:900;font-size:clamp(10px,2.4cqi,14px);padding:.3em .9em;transform:rotate(8deg);cursor:pointer;font-family:inherit;box-shadow:3px 3px 0 var(--line)}
.chance:focus-visible{outline:3px solid var(--gold)}

.token{position:absolute;width:9%;aspect-ratio:1.3;pointer-events:none;transition:left .25s ease,top .25s ease;z-index:5;filter:drop-shadow(2px 3px 0 rgba(0,0,0,.35))}

/* ---------- panel ---------- */
.panel{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--panel);border:1px solid var(--panel-line);border-radius:10px;padding:16px}
h1{font-size:22px;font-weight:900;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:.3em 0 0;font-size:14px}
.controls{display:flex;flex-wrap:wrap;gap:8px}
.btn{font-family:inherit;font-weight:700;font-size:14px;border:2px solid var(--line);background:var(--gold);color:#14221a;padding:.45em 1em;cursor:pointer;box-shadow:3px 3px 0 var(--line);border-radius:4px}
.btn.alt{background:var(--panel);color:var(--fg);border-color:var(--panel-line);box-shadow:none}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.msg{min-height:1.6em;font-size:14px;font-weight:700;color:var(--red);margin-top:10px}

.deed{padding:0;overflow:hidden}
.deed-head{background:var(--c,#888);color:#fff;padding:12px 16px;border-bottom:2px solid var(--line)}
.deed-head small{font-family:var(--display);letter-spacing:.08em;font-size:12px;opacity:.9}
.deed-head h2{margin:0;font-size:20px;font-weight:900}
.deed-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.goal{font-weight:700}
.deed ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;border-top:1px dashed var(--panel-line);padding-top:10px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.stat{display:flex;gap:16px;flex-wrap:wrap}
.stat div{display:flex;flex-direction:column}
.stat b{font-family:var(--display);font-size:24px;color:var(--red);line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.tip{background:color-mix(in srgb,var(--gold) 22%,var(--panel));border-left:4px solid var(--gold);padding:8px 10px;font-size:14px}
.deed a{color:var(--blue);font-weight:700}

.chance-card{display:flex;flex-direction:column;gap:4px}
.chance-card .q{font-weight:900}
.chance-card .a{color:var(--fg)}
.label{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:0 0 8px}

.bar{display:flex;height:34px;border:2px solid var(--line);border-radius:4px;overflow:hidden;font-size:12px;font-weight:700;color:#fff}
.bar div{display:flex;align-items:center;justify-content:center;white-space:nowrap;min-width:0}
.legend{display:flex;flex-direction:column;gap:4px;font-size:13px;margin-top:10px}
.legend span{display:inline-block;width:10px;height:10px;margin-right:6px;border-radius:2px;vertical-align:middle}
.foot{font-size:12px;color:var(--muted);margin-top:8px}

@media (prefers-reduced-motion: reduce){.token{transition:none}.die.rolling{animation:none}}
</style>

</head>
<body>
<div class="wrap">
  <div class="board-shell">
    <div class="board" id="board">
      <div class="center">
        <div class="logo"><b>充電車維修<br>大富翁</b><span>CART SERVICE</span></div>
        <div class="die" id="die" aria-live="polite">1</div>
        <button class="chance" id="chanceBtn" type="button">？機會</button>
      </div>
      <svg class="token" id="token" viewBox="0 0 52 40" aria-hidden="true">
        <rect x="6" y="3" width="40" height="26" rx="3" fill="#d6362a" stroke="#14221a" stroke-width="2.5"/>
        <rect x="11" y="8" width="13" height="16" fill="#fff" stroke="#14221a" stroke-width="1.5"/>
        <rect x="28" y="8" width="13" height="16" fill="#fff" stroke="#14221a" stroke-width="1.5"/>
        <circle cx="14" cy="34" r="5" fill="#14221a"/><circle cx="38" cy="34" r="5" fill="#14221a"/>
      </svg>
    </div>
  </div>

  <aside class="panel">
    <div class="card">
      <h1>充電車維修大富翁</h1>
      <p class="lede">一件報修從進來到請款，繞棋盤一圈。點任一格看該步驟怎麼做，或擲骰子走一遍。</p>
      <div class="controls" style="margin-top:12px">
        <button class="btn" id="rollBtn" type="button">擲骰子</button>
        <button class="btn alt" id="stepBtn" type="button">下一步</button>
        <button class="btn alt" id="homeBtn" type="button">回起點</button>
      </div>
      <div class="msg" id="msg"></div>
    </div>

    <div class="card deed" id="deed"></div>

    <div class="card" id="chanceCard" hidden>
      <p class="label">機會卡｜常見故障對照</p>
      <div class="chance-card"><div class="q" id="cq"></div><div class="a" id="ca"></div></div>
    </div>

    <div class="card">
      <p class="label">一件委外維修的時間花在哪</p>
      <div class="bar">
        <div style="width:39%;background:var(--green)">39%</div>
        <div style="width:47%;background:var(--red)">47%</div>
        <div style="width:14%;background:var(--purple)">14%</div>
      </div>
      <div class="legend">
        <div><span style="background:var(--green)"></span>報修 → 完工：平均 11.1 天（中位數 4）</div>
        <div><span style="background:var(--red)"></span>完工 → 送 BPM 請款：平均 13.5 天（中位數 10）</div>
        <div><span style="background:var(--purple)"></span>送 BPM → 請款日期：平均 3.9 天（中位數 3）</div>
      </div>
      <p class="foot">日曆天，非工時。來源：2026 年經銷商派工單、報修表單、報帳分頁。</p>
    </div>
  </aside>
</div>

<script>

const C = {blue:"var(--blue)",orange:"var(--orange)",green:"var(--green)",purple:"var(--purple)",red:"var(--red)",gold:"#b88a00"};

   done:"有 Case No、保固、HubSpot ID", url:N+"409a048f185e81ed844afbc804b343d5"},

  {name:"備料寄料", num:"04", color:C.orange, sys:"備品分頁",
   goal:"經銷商到校前手上就有料，每個備品都追得到用在哪。",

  {name:"派工", num:"05", color:C.orange, sys:"派工單",

const pos=[[4,4],[4,3],[4,2],[4,1],[3,1],[2,1],[1,1],[1,2],[1,3],[1,4],[2,4],[3,4]];
const side=i=> i<=3? "b" : i<=6? "l" : i<=9? "t" : "r";
const chances=[
  ["C30u+ 某一排無法充電","換 HUB 板。先排除 USB 線材短路。"],

  ["排插開關一直跳","換排插；也可能是過負載，請學校別接延長線。"],
  ["門卡住、無法上鎖","門榫、鎖頭、門桿固定套或插銷。"],
  ["輪子卡住、推動會偏","換車輪。煞車輪、方向輪、無踏板輪的輪子本體共用。"],
  ["碰車體有觸電感","多半是教室沒有接地，請改插三孔接地插座，先做漏電檢測。"],
  ["平板只充到 80%、圖示變灰","平板的電池保護設定，不是充電車故障，丟使用手冊給老師。"]
];

const board=document.getElementById("board"), token=document.getElementById("token"), deed=document.getElementById("deed"), msg=document.getElementById("msg"), die=document.getElementById("die");
const els=[];
tiles.forEach((t,i)=>{
  const b=document.createElement("button");
  b.type="button"; b.id="tile-"+i;
  const corner = t.kind==="go"||t.kind==="corner";
  b.className="tile "+(corner?"corner ":"side-"+side(i)+" ")+(t.kind==="go"?"go ":"")+(t.kind==="jail"?"jail side-"+side(i):"");
  b.style.gridRow=pos[i][0]; b.style.gridColumn=pos[i][1]; b.style.setProperty("--c",t.color);
  if(corner){
    b.innerHTML=`<span class="t-num">${t.num}</span><span class="t-big">${t.big}</span><span class="t-name">${t.name}</span><span class="t-sub">${t.sub}</span>`;
  }else if(t.kind==="jail"){
    b.innerHTML=`<span class="band"></span><span class="t-name">${t.name}</span><span class="t-sub" style="font-size:.75em">${t.sub}</span><span class="t-days">13.5天</span><span class="t-pct">47%</span>`;
  }else{
    b.innerHTML=`<span class="band"></span><span class="t-num">${t.num}</span><span class="t-name">${t.name}</span><span class="t-sys">${t.sys}</span>`;
  }
  b.setAttribute("aria-label",(t.num? t.num+" ":"")+(t.title||t.name));
  b.addEventListener("click",()=>{ if(!moving){ cur=i; place(); show(i);} });
  board.insertBefore(b, token); els.push(b);
});

let cur=0, moving=false;
function place(){
  const el=els[cur], bw=board.clientWidth;
  const w=bw*0.09, h=w/1.3;
  token.style.left=(el.offsetLeft+el.offsetWidth/2-w/2)+"px";
  token.style.top=(el.offsetTop+el.offsetHeight-h-6)+"px";
  els.forEach((e,k)=>e.classList.toggle("active",k===cur));
}
function show(i){
  const t=tiles[i];
  deed.style.setProperty("--c",t.color);
  const stat = t.stat? `<div class="stat">${t.stat.map(s=>`<div><b>${s[0]}</b><span>${s[1]}</span></div>`).join("")}</div>`:"";
  deed.innerHTML=`<div class="deed-head"><small>${t.num}</small><h2>${t.title||t.name}</h2></div>
  <div class="deed-body"><div class="goal">${t.goal}</div>${stat}
  <ol>${t.steps.map(s=>`<li>${s}</li>`).join("")}</ol>
  ${t.tip?`<div class="tip">${t.tip}</div>`:""}
  <dl class="kv"><dt>主要系統</dt><dd>${t.sys}</dd><dt>完成條件</dt><dd>${t.done}</dd></dl>
  <a href="${t.url}" target="_blank" rel="noopener">開啟 Notion 完整說明 →</a></div>`;
}
const sleep=ms=>new Promise(r=>setTimeout(r, matchMedia("(prefers-reduced-motion: reduce)").matches?0:ms));
async function move(n){
  if(moving) return; moving=true; msg.textContent="";
  let passed=false;
  for(let k=0;k<n;k++){ cur=(cur+1)%tiles.length; if(cur===0) passed=true; place(); await sleep(260); }
  show(cur);
  if(tiles[cur].kind==="jail") msg.textContent="卡關！這一格平均要等 13.5 天。";
  else if(passed) msg.textContent="經過起點：新的一週，先做每週例行。";
  moving=false;
}
document.getElementById("rollBtn").addEventListener("click",async()=>{
  if(moving) return;
  const n=1+Math.floor(Math.random()*6);
  die.classList.remove("rolling"); void die.offsetWidth; die.classList.add("rolling");
  die.textContent=n; await sleep(400); move(n);
});
document.getElementById("stepBtn").addEventListener("click",()=>{ die.textContent="1"; move(1); });
document.getElementById("homeBtn").addEventListener("click",()=>{ if(moving) return; cur=0; place(); show(0); msg.textContent=""; });
let ci=-1;
document.getElementById("chanceBtn").addEventListener("click",()=>{
  let n; do{ n=Math.floor(Math.random()*chances.length);}while(n===ci && chances.length>1); ci=n;
  document.getElementById("cq").textContent="症狀："+chances[n][0];
  document.getElementById("ca").textContent="通常要換："+chances[n][1];
  document.getElementById("chanceCard").hidden=false;
});
addEventListener("resize",place);
if(document.fonts) document.fonts.ready.then(place);
place(); show(0);
</script>

</body>
</html>
